name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # `npm ci` roda o lifecycle `prepare`, que executa `husky`. Sem esta variável o hook
      # instala os hooks no checkout do runner e imprime a mensagem de depreciação do
      # `husky.sh` — não quebra nada, e é por isso que passa despercebido.
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      # Custo assumido: um advisory `high` novo numa dependência transitiva deixa os PRs
      # vermelhos até um override/bump. A via de correção já praticada neste repo é o bloco
      # `overrides` do package.json (ver #98/#99), não baixar o nível de auditoria.
      - name: Audit known vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
